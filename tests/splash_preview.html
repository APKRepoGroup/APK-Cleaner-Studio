<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Açılış ekranı — görsel önizleme</title>
<style>
:root{--top:{{splash_gradient_top}};--center:{{splash_gradient_center}};--bottom:{{splash_gradient_bottom}};--title:{{splash_title}};--tagline:{{splash_tagline}};--glow:{{splash_glow}};color-scheme:{{theme}}}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(var(--top),var(--center),var(--bottom));color:var(--title);font-family:Arial,sans-serif}.splash{height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}.content{display:flex;flex-direction:column;align-items:center;text-align:center;animation:reveal 430ms ease-out both}.emblem{width:142px;height:142px;position:relative;margin-bottom:28px;display:grid;place-items:center}.glow{position:absolute;inset:1px;border-radius:50%;background:radial-gradient(var(--glow),transparent 70%);animation:glow 720ms 90ms ease-out both}.logo{width:112px;height:112px;position:relative;animation:logo 620ms cubic-bezier(.2,.8,.3,1.12) both}h1{font-size:25px;margin:0;font-weight:700}p{margin:9px 0 0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tagline)}.progress{width:92px;height:3px;border-radius:2px;margin-top:24px;background:linear-gradient(90deg,#2dcd9d,#c4ff2b);transform-origin:left;animation:progress 760ms 170ms ease-in-out both}.preview-note{position:fixed;bottom:12px;left:16px;right:16px;text-align:center;color:var(--tagline);font-size:11px;line-height:1.5}.preview-note button,.preview-note a{color:inherit;background:transparent;border:1px solid currentColor;border-radius:8px;padding:7px 10px;font:inherit;text-decoration:none;cursor:pointer}.preview-note small{display:block;margin-top:8px}@keyframes reveal{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes logo{from{opacity:0;transform:scale(.72) rotate(-4deg)}to{opacity:1;transform:none}}@keyframes glow{from{opacity:0;transform:scale(.68)}to{opacity:.34;transform:scale(1)}}@keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.glow{opacity:.34}}
</style></head><body>
<main class="splash"><div class="content"><div class="emblem"><div class="glow"></div><img class="logo" src="favicon.png" alt="AC"></div><h1>APK Cleaner Studio</h1><p>Yerel Android paket stüdyosu</p><div class="progress"></div></div></main>
<footer class="preview-note"><button id="replay" type="button">Animasyonu yeniden oynat</button> <a href="/?capture=dev5-splash&amp;theme=light">Açık</a> <a href="/?capture=dev5-splash&amp;theme=dark">Koyu</a><small>Görsel önizleme · Renkler Android kaynaklarından alınır.<br>Gerçek sistem açılış ekranı sonraki APK'da cihazda doğrulanır.</small></footer>
<script>document.querySelector('#replay').onclick=()=>{const content=document.querySelector('.content');const fresh=content.cloneNode(true);content.replaceWith(fresh);};</script></body></html>
