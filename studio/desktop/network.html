<section id="desktopNetworkCard" class="side-card side-data-card desktop-network-card">
  <small>BAĞLANTI</small><h3>Yerel ağ erişimi</h3>
  <p class="desktop-network-copy">Aynı ağdaki cihazlardan aşağıdaki adresi açın ve eşleştirme kodunu girin. Yalnızca güvendiğiniz ağlarda kullanın. Her uygulama açılışında erişim kapalı başlar.</p>
  <div id="desktopNetworkAddresses" class="desktop-network-addresses" hidden>
    <label>Eşleştirme kodu<input id="desktopNetworkCode" readonly aria-label="Eşleştirme kodu" autocomplete="off"></label>
    <label>Bağlantı adresi<input id="desktopNetworkUrl" readonly aria-label="Yerel ağ bağlantı adresi"></label>
    <label>HTTPS adresi · Sertifika kurulumu gerektirir<input id="desktopNetworkSecureUrl" readonly aria-label="Güvenli yerel ağ bağlantı adresi"></label>
  </div>
  <button id="desktopNetworkToggle" class="secondary" type="button" disabled>Denetleniyor…</button>
  <p id="desktopNetworkStatus" role="status" aria-live="polite">Bağlantı durumu hazırlanıyor.</p>
</section>
